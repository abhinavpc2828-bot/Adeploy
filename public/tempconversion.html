<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: rgba(207, 221, 224, 0.521);
      }
      h1 {
        color: rgb(144, 243, 243);
      }
      form {
        background-color: rgb(172, 177, 182);
        text-align: center;
        max-width: 350 px;
        margin: auto;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.3);
      }
      #num1 {
        width: 50%;
        text-align: center;
        font-size: 2em;
        border: 2px solid hsla(0, 0%, 0%, 0.8);
        border-radius: 4px;
        margin-top: 15px;
      }
      label {
        font-size: 1.5em;
        font-weight: bold;
      }
      button {
        margin-top: 15px;
        background-color: rgb(230, 39, 39);
        color: white;
        font-size: 1.5em;
        border: none;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
      }
      button:hover {
        background-color: rgb(0, 162, 255);
      }
      #result {
        font-size: 1.75em;
        font-weight: bold;
      }
    </style>
    <form>
      <h1>Temperature conversion:</h1>
      <input type="number" id="num1" value="0" /> <br />
      <input type="radio" id="tofahrenheit" name="unit" />
      <label for="tofahrenheit">Celcius ===> Fahrenheit</label><br />

      <input type="radio" id="tocelcius" name="unit" />
      <label for="tocelcius">Fahrenheit ===> Celcius</label><br />

      <button type="button" onclick="convert()">Submit</button>
      <p id="result">Result</p>
    </form>
    <script>
      const num1 = document.getElementById("num1");
      const tofahrenheit = document.getElementById("tofahrenheit");
      const tocelcius = document.getElementById("tocelcius");
      const result = document.getElementById("result");
      let temp;

      function convert() {
        if (tofahrenheit.checked) {
          temp = Number(num1.value);
          temp = (temp * 9) / 5 + 32;
          result.textContent = ` ${temp.toFixed(1)}  Fahrenheit`;
        } else if (tocelcius.checked) {
          temp = Number(num1.value);
          temp = ((temp - 32) * 5) / 9;
          result.textContent = `${temp.toFixed(1)} Celcius `;
        } else {
          result.textContent = "Select a unit";
        }
      }
    </script>
  </body>
</html>
