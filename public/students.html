  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css" />

    <!-- Student Page CSS -->
    <link rel="stylesheet" href="css/students.css" />
  </head>

  <body>
    <div class="container">
      <!-- ================= SIDEBAR ================= -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo">📚</div>
          <div class="sidebar-title">SCHOOLING</div>
        </div>

        <nav class="sidebar-nav">
          <a
            href="../Student_Management_system/future_features/dashboard.html"
            class="nav-item"
          >
            <span class="nav-icon">📊</span>
            <span>Dashboard</span>
          </a>

          <a
            href="../Student_Management_system/future_features/employee.html"
            class="nav-item"
          >
            <span class="nav-icon">👔</span>
            <span>Employee</span>
          </a>

          <a href="students.html" class="nav-item active">
            <span class="nav-icon">👨‍🎓</span>
            <span>Student</span>
          </a>

          <a
            href="../Student_Management_system/future_features/parents.html"
            class="nav-item"
          >
            <span class="nav-icon">👨‍👩‍👧</span>
            <span>Parent</span>
          </a>

          <a
            href="../Student_Management_system/future_features/applications.html"
            class="nav-item"
          >
            <span class="nav-icon">📋</span>
            <span>Applications</span>
          </a>

          <a
            href="../Student_Management_system/future_features/academics.html"
            class="nav-item"
          >
            <span class="nav-icon">📚</span>
            <span>Academics</span>
          </a>

          <a
            href="../Student_Management_system/future_features/calendar.html"
            class="nav-item"
          >
            <span class="nav-icon">📅</span>
            <span>Calendar</span>
          </a>

          <a
            href="../Student_Management_system/future_features/records.html"
            class="nav-item"
          >
            <span class="nav-icon">📄</span>
            <span>Records</span>
          </a>
        </nav>

        <div class="sidebar-bottom">
          <a
            href="../Student_Management_system/future_features/settings.html"
            class="nav-item"
          >
            <span class="nav-icon">⚙️</span>
            <span>Settings</span>
          </a>
        </div>
      </aside>

      <!-- ================= MAIN WRAPPER ================= -->
      <div class="main-wrapper">
        <!-- HEADER -->
        <header class="header">
          <div class="header-left">
            <button class="icon-button mobile-menu-button" id="mobileMenuBtn">
              ☰
            </button>

            <h1 class="header-title">Students</h1>
          </div>

          <div class="header-right">
            <button class="icon-button">🔔</button>

            <div class="user-profile">
              <div class="user-avatar">AD</div>

              <div class="user-info">
                <div class="user-name">Admin</div>

                <div class="user-role">Administrator</div>
              </div>
            </div>
          </div>
        </header>

        <!-- ================= MAIN CONTENT ================= -->
        <main class="main-content">
          <!-- PAGE ACTIONS -->
          <div class="page-actions">
             <button class="btn btn-primary" type="button"  onclick="new_Student_add_content_disp()">
              <span>+</span>
               Add Student
            </button>
                         <button class="btn btn-primary" type="button"   onclick="add_student_marks_content_disp()">+Add Marks</button>

            <button class="btn btn-primary" type="button" id="displayBtn" onclick="student_Disp_data()">
              Student Data
            </button>

             <button class="btn btn-primary" type="button" id="display_marks"  onclick="disp_student_marks()">Display Marks</button>
              
            <button class="btn btn-secondary">
              <span>⬇️</span>
              Import Students
            </button>

            <button class="btn btn-secondary">
              <span>⬆️</span>
              Export Students
            </button>
          </div>

          <!-- ================= SEARCH OPTIONS ================= -->
          <div class="card search-card">
            <div class="search-card-header">Search Options</div>
            
            <!-- RADIO BUTTONS -->
            <div class="search-options">
              
              <label class="search-option">
                <input
                  type="radio"
                  name="searchType"
                  id="search_using_roll"
                  value="roll"
                />

                <span> Roll Number </span>
              </label>

             </label></div>
          </div>

            <!-- SEARCH INPUT -->
            <div class="student-search">
              <span class="student-search-icon"> 🔍 </span>

              <input
                type="text"
                id="search_Box"
                placeholder="Search students..."
                oninput="search_Student()"
              />
            </div>
          <!-- ================= STUDENT TABLE ================= -->
          <div class="card student-list-card">
            <div class="card-header">
              <div class="card-title">Student List</div>

              <div class="student-table-actions">
                <button class="btn btn-secondary btn-small">Sort</button>

                <button class="btn btn-secondary btn-small">Filter</button>

                <button class="menu-dot">⋯</button>
              </div>
            </div>
            <div id="studentTable" class="student-table-container">
              <div class="coming-soon">
                <p >Student data will be displayed here ...</p>
              </div>
                
              </div>
            </div>
          </main>
        </div>
      </div> 
      <script src="students.js"></script>
    </body>
    </html>
