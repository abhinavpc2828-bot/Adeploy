<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e3a8a, #2563eb);
        color: #f8fafc;
        padding: 20px;
      }

      .card {
        width: 100%;
        max-width: 480px;
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        padding: 32px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        text-align: center;
      }

      h1 {
        margin-top: 0;
        margin-bottom: 16px;
        font-size: 2rem;
      }

      #result {
        margin: 20px 0;
        padding: 14px 16px;
        min-height: 52px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.2);
        font-size: 1rem;
        font-weight: 600;
        word-break: break-all;
      }

      button {
        padding: 12px 24px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        border-radius: 999px;
        color: #fff;
        background: linear-gradient(90deg, #22d3ee, #3b82f6);
        box-shadow: 0 8px 20px rgba(59, 130, 246, 0.35);
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 24px rgba(59, 130, 246, 0.45);
      }
    </style>
    <div class="card">
      <h1>Random Password Generator</h1>
      <p id="result">Click the button to generate a secure password.</p>
      <button onclick="showPassword()">Generate Password</button>
    </div>

    <script>
      // Random password generator

      function generatePassword(
        length,
        includelowerCase,
        includeupperCase,
        includeNumbers,
        includeSymbols,
      ) {
        const lowercase = "abcdefghijklmnopqrstuvwxyz";
        const uppercase = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const numbers = "0123456789";
        const symbols = "!@#$%^&*()_+-";

        let allowedChars = "";
        let password = "";
        allowedChars += includelowerCase ? lowercase : "";
        allowedChars += includeupperCase ? uppercase : "";
        allowedChars += includeNumbers ? numbers : "";
        allowedChars += includeSymbols ? symbols : "";

        if (length <= 0) {
          return "Password length must be greater than 1";
        }
        if (allowedChars.length === 0) {
          return "Please select at least 1 character type";
        }

        for (let i = 0; i < length; i++) {
          const randomindex = Math.floor(Math.random() * allowedChars.length);
          password += allowedChars[randomindex];
        }
        return password;
      }

      const passwordLength = 12;
      const includelowerCase = true;
      const includeupperCase = true;
      const includeNumbers = true;
      const includeSymbols = true;

      function showPassword() {
        const password = generatePassword(
          passwordLength,
          includelowerCase,
          includeupperCase,
          includeNumbers,
          includeSymbols,
        );
        document.getElementById("result").textContent = password;
      }
    </script>
  </body>
</html>
