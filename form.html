<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Submission</title>
    <link rel="stylesheet" type="text/css" href="style1.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="form-card">
        <h1>Form</h1>
        <p class="form-intro">Fill in your details and launch the next step.</p>

        <div class="input-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter your username" />
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="A Strong Password Required"
          />
        </div>

        <div class="input-group">
          <label for="ads">Address</label>
          <input type="text" id="ads" placeholder="Your Local Address" />
        </div>

        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="xyz@gmail.com" />
        </div>

        <div class="input-group">
          <label for="telephone">Telephone</label>
          <input type="tel" id="telephone" placeholder="#91-" />
        </div>

        <div class="input-group">
          <label for="bday">Birthday</label>
          <input type="date" id="bday" />
        </div>

        <div class="input-group">
          <label for="quantity">Quantity</label>
          <input type="number" id="quantity" min="0" max="100" />
        </div>

        <div class="input-group">
          <label>Title</label>
          <div class="radio-group">
            <label class="choice-pill" for="Mr">
              <input type="radio" id="Mr" value="Mr" name="title" />
              Mr
            </label>
            <label class="choice-pill" for="Mrs">
              <input type="radio" id="Mrs" value="Mrs" name="title" />
              Mrs
            </label>
            <label class="choice-pill" for="Dr">
              <input type="radio" id="Dr" value="Dr" name="title" />
              Dr
            </label>
          </div>
        </div>

        <div class="input-group">
          <label for="Payment">Payment</label>
          <select id="Payment">
            <option value="UPI">UPI</option>
            <option value="SBI">SBI</option>
            <option value="HDFC">HDFC</option>
          </select>
        </div>

        <div class="input-group">
          <label for="Comments">Comments</label>
          <textarea
            id="Comments"
            rows="3"
            placeholder="Tell us more..."
          ></textarea>
        </div>

        <div class="input-group">
          <label for="File">File</label>
          <input type="file" id="File" accept="image/png, image/jpg" />
        </div>

        <div class="button-row">
          <input
            class="btn btn-submit"
            type="submit"
            id="submit"
            onclick="submitform()"
            value="Submit"
          />
          <input class="btn btn-reset" type="reset" id="reset" value="Reset" />
        </div>
      </div>
    </div>

    <script>
      function submitform() {
        const username = document.getElementById("username").value;

        localStorage.setItem("submitname", username);
        window.location.href = "formresult.html";

        const ads = document.getElementById("ads").value;
        localStorage.setItem("urads", ads);

        const email = document.getElementById("email").value;
        localStorage.setItem("subemail", email);

        const telephone = document.getElementById("telephone").value;
        localStorage.setItem("subtel", telephone);

        const bday = document.getElementById("bday").value;
        localStorage.setItem("subbday", bday);

        const qunty = document.getElementById("quantity").value;
        localStorage.setItem("subqunty", qunty);

        let title = document.querySelector('input[name="title"]:checked');
        if (title) {
          localStorage.setItem("subtitle", title.value);
        }

        let pymt = document.getElementById("Payment").value;
        localStorage.setItem("subpymt", pymt);

        let cmt = document.getElementById("Comments").value;
        localStorage.setItem("subcmt", cmt);
      }
    </script>
  </body>
</html>
